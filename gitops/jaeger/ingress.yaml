apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ui
  namespace: observability
spec:
  ingressClassName: traefik
  rules:
    - host: jaeger.homelab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jaeger-ui
                port:
                  number: 16686
