apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      # Storage en memoria, mismo criterio que en docker-compose (Idea 7):
      # persistencia en Jaeger v2 requiere un config.yaml de pipeline propio,
      # no justificado para datos de traces. Un pod que se reinicia pierde
      # los traces -- aceptado.
      containers:
        - name: jaeger
          image: jaegertracing/jaeger:2.20.0
          ports:
            - name: ui
              containerPort: 16686
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
