apiVersion: v1
kind: Service
metadata:
  name: jaeger-ui
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-otlp
  namespace: observability
spec:
  # LoadBalancer, no Ingress: OTLP es gRPC/HTTP de ingesta entre servicios,
  # no trafico de navegador -- Traefik se usa para lo que es (la UI, via
  # Ingress mas abajo). k3s ya trae su propio LoadBalancer (klipper-lb),
  # confirmado funcionando con Traefik desde la Idea 6.
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  type: LoadBalancer
