# Namespaces de plataforma excluidos a proposito: kube-system, gatekeeper-system
# y argocd son infraestructura del propio cluster, no cargas de aplicacion --
# verificado que los pods de ArgoCD (manifiesto oficial) no traen resources ni
# runAsNonRoot por defecto. Estas politicas gobiernan lo que se despliega
# como aplicacion (ej. observability/), no el control plane del cluster.
#
# sync-wave "1": Gatekeeper registra el CRD de cada ConstraintTemplate de
# forma asincrona (unos segundos despues de crearse el ConstraintTemplate) --
# sin esta anotacion, ArgoCD intenta crear los Constraint en la misma pasada
# y falla con "the server could not find the requested resource" porque el
# CRD todavia no existe. Encontrado en la practica, no anticipado.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireNonRoot
metadata:
  name: require-non-root
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "argocd"]
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireResources
metadata:
  name: require-resources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "argocd"]
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sDisallowedTags
metadata:
  name: disallow-latest-tag
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "argocd"]
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequireDropCapabilities
metadata:
  name: require-drop-capabilities
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces: ["kube-system", "gatekeeper-system", "argocd"]
