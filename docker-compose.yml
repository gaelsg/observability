services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - ./prometheus/vault-ca.pem:/etc/prometheus/vault-ca.pem:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  pve-exporter:
    image: prompve/prometheus-pve-exporter:latest
    container_name: pve-exporter
    environment:
      PVE_USER: ${PROXMOX_USER}
      PVE_TOKEN_NAME: ${PROXMOX_TOKEN_NAME}
      PVE_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE}
      PVE_VERIFY_SSL: ${PROXMOX_VERIFY_SSL}
    ports:
      - "9221:9221"
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    pid: host
    volumes:
      - /:/host:ro,rslave
    command:
      - --path.rootfs=/host
    ports:
      - "9100:9100"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Sin esto Grafana arma el redirect_uri de OAuth con su URL interna
      # (localhost:3000) en vez de la URL externa real -- causa el "Redirect
      # URI Error" en Authentik aunque el registrado ahi sea correcto.
      GF_SERVER_ROOT_URL: "http://192.168.8.90:3001/"
      # SSO via Authentik (OIDC) -- login local con admin/password sigue
      # disponible aparte, no se desactiva (via GF_AUTH_DISABLE_LOGIN_FORM).
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: "Authentik"
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email"
      # HTTPS (9443), no HTTP (9000): el frontend de Authentik intenta
      # inicializar WebAuthn/passkeys en la pantalla de login, y esa API del
      # navegador no existe fuera de un contexto seguro -- mismo motivo por
      # el que el boton de copiar del token fallaba antes. Certificado
      # autofirmado, de ahi el TLS_SKIP_VERIFY_INSECURE.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://192.168.8.94:9443/application/o/authorize/"
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "https://192.168.8.94:9443/application/o/token/"
      GF_AUTH_GENERIC_OAUTH_API_URL: "https://192.168.8.94:9443/application/o/userinfo/"
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "true"
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: loki
    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
