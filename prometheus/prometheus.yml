global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - "alert-rules.yml"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "pve"
    static_configs:
      - targets: ["pve-exporter:9221"]
    metrics_path: /pve
    params:
      target: ["192.168.8.75"]

  - job_name: "vault"
    scheme: https
    metrics_path: /v1/sys/metrics
    params:
      format: ["prometheus"]
    tls_config:
      ca_file: /etc/prometheus/vault-ca.pem
    static_configs:
      - targets: ["192.168.8.91:8200"]
