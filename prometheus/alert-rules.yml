groups:
  - name: infra
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} caido"
          description: "{{ $labels.instance }} lleva mas de 2 minutos sin responder al scrape."

      # No existe una metrica "vault_core_unsealed" (se investigo el output
      # real del exporter con curl antes de asumirlo - no estaba). Un Vault
      # sellado probablemente deja de responder /v1/sys/metrics (quedaria
      # cubierto por TargetDown de arriba), pero esto no se verifico
      # empiricamente - habria requerido sellar Vault de nuevo solo para
      # probarlo, y el vault-admin AppRole no tiene permiso sys/seal a
      # proposito (misma politica admin-limited de la Idea 2). Pendiente:
      # confirmar en la practica la proxima vez que Vault quede sellado por
      # otra razon. vault_core_active si existe pero mide activo/standby en
      # un cluster, no sealed/unsealed - no aplica a este nodo unico.

      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU alto en {{ $labels.instance }}"
          description: "Uso de CPU por encima de 90% durante mas de 5 minutos."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Poco espacio en disco en {{ $labels.instance }}"
          description: "Menos del 10% de espacio libre en {{ $labels.mountpoint }}."
