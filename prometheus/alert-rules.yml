groups:
  - name: infra
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Target {{ $labels.job }} caido"
          description: "{{ $labels.instance }} lleva mas de 2 minutos sin responder al scrape."

      # Verificado empiricamente 2026-08-30 (root token generado con la
      # ceremonia generate-root, Vault sellado/desellado a proposito): la
      # metrica "vault_core_unsealed" SI existe (la revision original de la
      # Idea 3 se habia equivocado, o el build de Vault en ese momento no la
      # exponia). Ademas se confirmo que TargetDown NO cubre este caso:
      # /v1/sys/metrics sigue devolviendo 200 OK con Vault sellado (solo
      # cambian los valores internos), asi que el scrape nunca falla.
      - alert: VaultSealed
        expr: vault_core_unsealed == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Vault sellado"
          description: "vault_core_unsealed en 0 en {{ $labels.instance }} - Vault no puede servir secretos hasta que se desselle con 3 de las 5 unseal keys."

      - alert: HighCPU
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU alto en {{ $labels.instance }}"
          description: "Uso de CPU por encima de 90% durante mas de 5 minutos."

      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 < 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Poco espacio en disco en {{ $labels.instance }}"
          description: "Menos del 10% de espacio libre en {{ $labels.mountpoint }}."
